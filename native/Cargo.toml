[package]
name = "polymer-native"
version = "0.1.0"
edition = "2021"
description = "Polymer Lab compute kernels (Blends-style contact sampling) for Python"
license = "MIT"
publish = false

[lib]
name = "workbench_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py312"], optional = true }
numpy = { version = "=0.29.0", optional = true }
rayon = "=1.12.0"

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
lto = "thin"
codegen-units = 1
