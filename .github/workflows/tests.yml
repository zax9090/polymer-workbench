name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements.desktop.lock.txt

      # GROMACS runs the Martini 3 mixture tests; Ubuntu 24.04 ships 2023.3, the version they were validated with.
      - name: Install GROMACS
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gromacs
          gmx --version | head -n 1

      - name: Install pinned research environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.lock.txt
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps -e .

      # BayBE campaign tests; pins come from the desktop lock, with the CPU-only torch build.
      - name: Install BayBE (CPU torch)
        run: |
          .venv/bin/python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu \
            $(grep -E '^(attrs|baybe|botorch|cattrs|exceptiongroup|fsspec|gpytorch|Jinja2|linear_operator|MarkupSafe|mpmath|multipledispatch|mypy_extensions|ninja|pyre-extensions|sympy|torch|typing-inspect)==' requirements.desktop.lock.txt)

      # Pinned upstream bytes let the reference-data rebuild test run instead of skipping.
      - name: Fetch pinned REA-audited sources
        run: .venv/bin/python scripts/audit_extensions.py --fetch-pinned

      # TEMPORARY diagnosis of the SIGTERM seen during the in-process LAMMPS test; removed with the fix.
      - name: Diagnose in-process MPI initialization
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq strace >/dev/null
          export PATH="$PWD/.venv/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/.venv/lib:${LD_LIBRARY_PATH:-}"
          ls -l /dev/infiniband 2>&1 | head -5 || true
          ls /sys/class/infiniband 2>&1 | head -5 || true
          env | grep -E '^(PMI|HYDRA|MPI|UCX|FI_|OMPI|SLURM)' || true
          setsid bash -c 'MPIR_CVAR_DEBUG_SUMMARY=1 strace -f -qq -e trace=kill,tgkill,execve,setsid,setpgid -o strace.log .venv/bin/python -c "from lammps import lammps; l=lammps(cmdargs=[\"-screen\",\"none\",\"-log\",\"none\"]); l.close(); print(\"probe alive\")"; echo "probe exit $?"' || true
          grep -v ENOENT strace.log | grep -E 'kill|execve|setsid|setpgid' | grep -v '"/opt/hostedtoolcache\|\.venv/bin/python"' | head -40 || true
          setsid bash -c '.venv/bin/python -m pytest -q -p no:cacheprovider "tests/test_science.py::ScientificChecks::test_lammps_matches_independent_potential"; echo "isolated test exit $?"' || true

      - name: Run pytest
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/.venv/lib:${LD_LIBRARY_PATH:-}"
          .venv/bin/python -m pytest -q -rs
